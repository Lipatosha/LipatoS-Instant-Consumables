name: Release LipatoS Instant Consumables v1.3.1

on:
  push:
    paths:
      - ".github/workflows/release-v1.3.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Verify JavaScript and instant consumption
        run: |
          node --check scripts/main.mjs
          node tests/smoke.cjs
          node -e 'const m=require("./module.json");if(m.version!=="1.3.1")process.exit(1);'
      - name: Build installable module
        run: |
          zip -q lipatos-instant-consumables.zip module.json scripts/main.mjs README.md
          unzip -t lipatos-instant-consumables.zip
          unzip -p lipatos-instant-consumables.zip module.json | python3 -m json.tool > /dev/null
      - name: Publish v1.3.1 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3.1 lipatos-instant-consumables.zip module.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LipatoS — Мгновенное употребление v1.3.1" \
            --notes "Откат изменений последней версии: восстановлено поведение v1.2.0. Код основной логики восстановлен из тега v1.2.0."
